    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #mySketch {
            z-index: 0;
            position: fixed;
            top: 0px;
            left: 0px;
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        h2 {
            font-size: 24px;
            margin: 30px 0 20px;
            color: #fff;
            letter-spacing: 2px;
        }

        /* MENU / BOTÕES PRETOS */
        .labubu {
            display: flex;
            justify-content: center;
            gap: 30px;
            list-style: none;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .labubu li a {
            text-decoration: none;
            color: #fff;
            padding: 12px 28px;
            background: #000;
            border-radius: 40px;
            transition: all 0.3s ease;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .labubu li a:hover {
            background: #222;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border-color: rgba(255,255,255,0.5);
        }

        .contactos-card {
            max-width: 550px;
            margin: 30px auto;
            background: #000;
            border-radius: 24px;
            padding: 30px 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .contactos-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5);
            border-color: rgba(255,255,255,0.3);
        }

        .contacto-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 18px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .contacto-item:last-child {
            border-bottom: none;
        }

        .contacto-item:hover {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding-left: 25px;
        }

        .contacto-icone {
            font-size: 32px;
            min-width: 55px;
            text-align: center;
        }

        .contacto-info {
            text-align: left;
            flex: 1;
        }

        .contacto-info strong {
            display: block;
            font-size: 13px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }

        .contacto-info a,
        .contacto-info span {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .contacto-info a:hover {
            color: #ccc;
            text-decoration: underline;
        }

        /* REDES SOCIAIS - PRETAS */
        .redes-sociais {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 35px 0 25px;
        }

        .redes-sociais a {
            color: #fff;
            text-decoration: none;
            padding: 12px 30px;
            background: #000;
            border-radius: 50px;
            transition: all 0.3s;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .redes-sociais a:hover {
            background: #222;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border-color: rgba(255,255,255,0.5);
        }

        /* TEXTO FINAL */
        .container > p {
            color: #fff;
            margin-top: 30px;
            font-size: 16px;
            background: rgba(0,0,0,0.7);
            display: inline-block;
            padding: 10px 25px;
            border-radius: 50px;
        }

        /* RESPONSIVO */
        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }
            
            .contactos-card {
                margin: 20px;
                padding: 20px;
            }
            
            .contacto-item {
                gap: 12px;
                padding: 12px 10px;
            }
            
            .contacto-icone {
                font-size: 26px;
                min-width: 45px;
            }
            
            .contacto-info a,
            .contacto-info span {
                font-size: 15px;
            }
            
            .redes-sociais {
                gap: 15px;
                flex-wrap: wrap;
            }
            
            .redes-sociais a {
                padding: 8px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
