    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #mySketch {
            z-index: 0;
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
        }
        
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            background: transparent;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        h2 {
            font-size: 24px;
            margin: 30px 0 20px;
            color: #fff;
            letter-spacing: 2px;
        }

        .labubu {
            display: flex;
            justify-content: center;
            gap: 30px;
            list-style: none;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .labubu li a {
            text-decoration: none;
            color: #fff;
            padding: 12px 28px;
            background: #000;
            border-radius: 40px;
            transition: all 0.3s ease;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .labubu li a:hover {
            background: #222;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border-color: rgba(255,255,255,0.5);
        }

        .contactos-card {
            max-width: 550px;
            margin: 30px auto;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .contactos-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5);
            border-color: rgba(255,255,255,0.3);
        }

        .contacto-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 18px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .contacto-item:last-child {
            border-bottom: none;
        }

        .contacto-item:hover {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding-left: 25px;
        }

        .contacto-icone {
            font-size: 32px;
            min-width: 55px;
            text-align: center;
        }

        .contacto-info {
            text-align: left;
            flex: 1;
        }

        .contacto-info strong {
            display: block;
            font-size: 13px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }

        .contacto-info a,
        .contacto-info span {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .contacto-info a:hover {
            color: #ccc;
            text-decoration: underline;
        }

        .redes-sociais {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 35px 0 25px;
        }

        .redes-sociais a {
            color: #fff;
            text-decoration: none;
            padding: 12px 30px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            transition: all 0.3s;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .redes-sociais a:hover {
            background: #222;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border-color: rgba(255,255,255,0.5);
        }

        .container > p {
            color: #fff;
            margin-top: 30px;
            font-size: 16px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            display: inline-block;
            padding: 10px 25px;
            border-radius: 50px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }
            
            .contactos-card {
                margin: 20px;
                padding: 20px;
            }
            
            .contacto-item {
                gap: 12px;
                padding: 12px 10px;
            }
            
            .contacto-icone {
                font-size: 26px;
                min-width: 45px;
            }
            
            .contacto-info a,
            .contacto-info span {
                font-size: 15px;
            }
            
            .redes-sociais {
                gap: 15px;
                flex-wrap: wrap;
            }
            
            .redes-sociais a {
                padding: 8px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <script>
        // SKETCH P5.JS - BOLAS COLORIDAS
        let c1X, c1Y, c2X, c2Y, c3X, c3Y, c4X, c4Y, c5X, c5Y, c6X, c6Y, c7X, c7Y;
        let vel1, vel2, vel3, vel4, vel5, vel6, vel7;
        let dirX1, dirY1, dirX2, dirY2, dirX3, dirY3, dirX4, dirY4, dirX5, dirY5, dirX6, dirY6, dirX7, dirY7;
        let cor1, cor2, cor3, cor4, cor5, cor6, cor7;

        function setup() {
            let canv = createCanvas(windowWidth, windowHeight);
            canv.parent('mySketch');
            background(0);

            // POSIÇÕES
            c1X = 10;
            c1Y = 10;
            c2X = 200;
            c2Y = 200;
            c3X = 300;
            c3Y = 300;
            c4X = 400;
            c4Y = 100;
            c5X = 500;
            c5Y = 400;
            c6X = 700;
            c6Y = 200;
            c7X = 900;
            c7Y = 500;

            // VELOCIDADES
            vel1 = 1;
            vel2 = 2;
            vel3 = 3;
            vel4 = 2.5;
            vel5 = 1.5;
            vel6 = 2.8;
            vel7 = 3.5;

            // DIREÇÕES
            dirX1 = 1;
            dirY1 = -1;
            dirX2 = -1;
            dirY2 = -1;
            dirX3 = -1;
            dirY3 = 1;
            dirX4 = 1;
            dirY4 = 1;
            dirX5 = -1;
            dirY5 = 1;
            dirX6 = 1;
            dirY6 = -1;
            dirX7 = -1;
            dirY7 = -1;

            // CORES
            cor1 = color(255, 0, 0);
            cor2 = color(0, 255, 0);
            cor3 = color(0, 0, 255);
            cor4 = color(255, 255, 0);
            cor5 = color(255, 0, 255);
            cor6 = color(0, 255, 255);
            cor7 = color(255);
        }

        function draw() {
            // Fundo com transparência para efeito de rasto
            background(0, 0, 0, 50);

            // MOVIMENTO
            c1X += vel1 * dirX1;
            c1Y += vel1 * dirY1;
            c2X += vel2 * dirX2;
            c2Y += vel2 * dirY2;
            c3X += vel3 * dirX3;
            c3Y += vel3 * dirY3;
            c4X += vel4 * dirX4;
            c4Y += vel4 * dirY4;
            c5X += vel5 * dirX5;
            c5Y += vel5 * dirY5;
            c6X += vel6 * dirX6;
            c6Y += vel6 * dirY6;
            c7X += vel7 * dirX7;
            c7Y += vel7 * dirY7;

            // BORDAS
            if (c1X > width || c1X < 0) dirX1 *= -1;
            if (c1Y > height || c1Y < 0) dirY1 *= -1;
            if (c2X > width || c2X < 0) dirX2 *= -1;
            if (c2Y > height || c2Y < 0) dirY2 *= -1;
            if (c3X > width || c3X < 0) dirX3 *= -1;
            if (c3Y > height || c3Y < 0) dirY3 *= -1;
            if (c4X > width || c4X < 0) dirX4 *= -1;
            if (c4Y > height || c4Y < 0) dirY4 *= -1;
            if (c5X > width || c5X < 0) dirX5 *= -1;
            if (c5Y > height || c5Y < 0) dirY5 *= -1;
            if (c6X > width || c6X < 0) dirX6 *= -1;
            if (c6Y > height || c6Y < 0) dirY6 *= -1;
            if (c7X > width || c7X < 0) dirX7 *= -1;
            if (c7Y > height || c7Y < 0) dirY7 *= -1;

            // COLISÕES
            if (dist(c1X, c1Y, c2X, c2Y) < 70) {
                cor1 = color(random(255), random(255), random(255));
                cor2 = color(random(255), random(255), random(255));
                dirX1 *= -1;
                dirY2 *= -1;
            }
            if (dist(c3X, c3Y, c4X, c4Y) < 70) {
                cor3 = color(random(255), random(255), random(255));
                cor4 = color(random(255), random(255), random(255));
                dirX3 *= -1;
                dirY4 *= -1;
            }
            if (dist(c5X, c5Y, c6X, c6Y) < 70) {
                cor5 = color(random(255), random(255), random(255));
                cor6 = color(random(255), random(255), random(255));
                dirX5 *= -1;
                dirY6 *= -1;
            }
            if (dist(c7X, c7Y, c1X, c1Y) < 70) {
                cor7 = color(random(255), random(255), random(255));
                cor1 = color(random(255), random(255), random(255));
                dirX7 *= -1;
                dirY1 *= -1;
            }

            // DESENHAR
            fill(cor1);
            circle(c1X, c1Y, 80);
            fill(cor2);
            circle(c2X, c2Y, 60);
            fill(cor3);
            circle(c3X, c3Y, 70);
            fill(cor4);
            circle(c4X, c4Y, 90);
            fill(cor5);
            circle(c5X, c5Y, 50);
            fill(cor6);
            circle(c6X, c6Y, 100);
            fill(cor7);
            circle(c7X, c7Y, 75);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
