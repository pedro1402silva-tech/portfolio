<!DOCTYPE html>
<html>
<head>
    <title>Blog</title>
    <meta charset="UTF-8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        /* Canvas de fundo */
        #mySketch {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Conteúdo sobre o fundo */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 30px;
            color: #fff;
        }

        .labubu {
            display: flex;
            justify-content: center;
            gap: 30px;
            list-style: none;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .labubu li a {
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 30px;
            transition: 0.3s;
            font-weight: bold;
            color: #03045e;
            background-color: #caf0f8;
        }

        .labubu li a:hover {
            background: #03045e;
            color: white;
        }

        .blog-post {
            background: rgba(0, 0, 0, 0.6);
            padding: 25px;
            margin: 20px auto;
            border-radius: 15px;
            max-width: 800px;
            text-align: left;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="mySketch"></div>
    
    <div class="container">
        <h1>Blog</h1>
        <ul class="labubu">
            <li><a href="index.html">Início</a></li>
            <li><a href="trabalhos.html">Trabalhos</a></li>
            <li><a href="informacoes.html">Contactos</a></li>
            <li><a href="Blog.html">Blog</a></li>
            <li><a href="cv_pedrosilva25.pdf" target="_blank">Download CV</a></li>
        </ul>

        <div class="blog-post">
            <h2>This is a Heading</h2>
            <p>This is a paragraph.</p>
        </div>
    </div>

    <script>
        // Sketch p5.js MÍNIMO - apenas fundo escuro
        function setup() {
            let canvas = createCanvas(windowWidth, windowHeight);
            canvas.parent('mySketch');
            background(10, 30, 50); // Azul escuro
        }
        
        function draw() {
            // Estático - sem animação
            // (podes mudar a cor aqui se quiseres)
        }
        
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            background(10, 30, 50);
        }
    </script>
</body>
</html>
