    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background: transparent;
            min-height: 100vh;
        }

        #mySketch {
            z-index: 0;
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .labubu {
            display: flex;
            justify-content: center;
            gap: 30px;
            list-style: none;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .labubu li a {
            text-decoration: none;
            color: #fff;
            padding: 12px 28px;
            background: #000;
            border-radius: 40px;
            transition: all 0.3s ease;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .labubu li a:hover {
            background: #222;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border-color: rgba(255,255,255,0.5);
        }
        .slideshow-container {
            position: relative;
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(0,0,0,0.6);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        /* Hide the images by default */
        .mySlides {
            display: none;
        }

        /* Add a pointer when hovering over the thumbnail images */
        .cursor {
            cursor: pointer;
        }

        /* Next & previous buttons */
        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 45%;
            width: auto;
            padding: 16px;
            margin-top: -50px;
            color: white;
            font-weight: bold;
            font-size: 24px;
            border-radius: 0 3px 3px 0;
            user-select: none;
            -webkit-user-select: none;
            background-color: rgba(0,0,0,0.6);
            transition: 0.3s;
            text-decoration: none;
        }

        /* Position the "next button" to the right */
        .next {
            right: 20px;
            border-radius: 3px 0 0 3px;
        }
        
        .prev {
            left: 20px;
            border-radius: 3px 0 0 3px;
        }

        /* On hover, add a black background color with a little bit see-through */
        .prev:hover, .next:hover {
            background-color: rgba(0, 0, 0, 0.9);
            color: #caf0f8;
        }

        /* Number text (1/6 etc) */
        .numbertext {
            color: #f2f2f2;
            font-size: 14px;
            padding: 8px 12px;
            position: absolute;
            top: 30px;
            left: 30px;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            font-weight: bold;
        }

        /* Container for image text */
        .caption-container {
            text-align: center;
            background-color: #000;
            padding: 10px 16px;
            color: white;
            margin-top: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Row of thumbnails */
        .row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        /* Six columns side by side (ajustado para responsivo) */
        .column {
            flex: 1 1 100px;
            max-width: 100px;
            padding: 0 4px;
        }

        /* Add a transparency effect for thumbnail images */
        .demo {
            opacity: 0.6;
            width: 100%;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .active, .demo:hover {
            opacity: 1;
            border-color: #fff;
            transform: scale(1.05);
        }

        /* Imagem principal */
        .main-img {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* Responsivo */
        @media (max-width: 768px) {
            h1 {
                font-size: 36px;
            }
            .column {
                flex: 1 1 70px;
                max-width: 70px;
            }
            .prev, .next {
                padding: 10px;
                font-size: 18px;
            }
            .numbertext {
                top: 15px;
                left: 15px;
                font-size: 10px;
            }
        }
        
        @media (max-width: 480px) {
            .column {
                flex: 1 1 50px;
                max-width: 50px;
            }
        }
    </style>
</head>
